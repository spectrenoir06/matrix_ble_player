# Builds the firmware on every push; a v* tag also publishes it as a GitHub
# Release. spectre-server picks up the latest release for the app's install
# screen (spectre-bt-app: scripts/sync-firmware.sh).
#
# spectre_protocol is a private repo: read with a deploy key, secret
# SPECTRE_PROTOCOL_KEY, at the commit in spectre_protocol.ref.
name: Firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write  # the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: git describe gives the version

      - name: Read the spectre_protocol commit
        id: proto
        run: echo "ref=$(cat spectre_protocol.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: spectrenoir06/spectre_protocol
          ref: ${{ steps.proto.outputs.ref }}
          ssh-key: ${{ secrets.SPECTRE_PROTOCOL_KEY }}
          path: spectre_protocol

      # platformio.ini links ../../spectre_protocol (the two repos side by side)
      - name: Put spectre_protocol where platformio.ini expects it
        run: ln -s "$GITHUB_WORKSPACE/spectre_protocol" "$(cd ../.. && pwd)/spectre_protocol"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e matrix

      # ESP Web Tools layout (manifest + images), as the app's install screen
      # serves it from /matrix/firmware/
      - name: Package
        run: |
          VERSION=$(git describe --tags --always)
          python3 scripts/export_web.py out/firmware
          tar -C out/firmware -czf "matrix-firmware-web.tar.gz" .
          cp .pio/build/matrix/firmware.bin "matrix-firmware-$VERSION.bin"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: matrix-firmware-${{ env.VERSION }}
          path: |
            matrix-firmware-web.tar.gz
            matrix-firmware-*.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            matrix-firmware-web.tar.gz
            matrix-firmware-*.bin
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}  # v2.1.0-rc1: not "latest"
