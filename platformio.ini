; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = matrix



[env]

platform = platformio/espressif32 @ 7.1.3  ; Arduino core 2.0.17 (ESP-IDF 4.4), pinned
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partition_table/matrix_4mb.csv  ; every board: 4 MB flash
board_build.f_cpu = 240000000L
monitor_filters = esp32_exception_decoder

build_flags = 
	!echo '-D BUILD_GIT_BRANCH=\"'$(git branch --no-color 2> /dev/null | sed -e '/^[^*]/d' -e "s/* \(.*\)/\1/")'\"'
	!echo '-D BUILD_GIT_COMMIT_HASH=\"'$(git log -1 --format=%%h)'\"'
	; -DCORE_DEBUG_LEVEL=5
	; NimBLE host buffers (default 12): 24 = +15-30% BLE upload speed for 3.5 KB RAM
	-D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
lib_deps =  ; exact versions (tested together); HUB75: fork with copyDMABuffer() for GIFs
	git+https://github.com/acondolu/ESP32-HUB75-MatrixPanel-DMA#466454339b1e9d678b187dc3900a620407177328
	h2zero/NimBLE-Arduino@1.4.2
	bitbank2/AnimatedGIF@1.4.7
	https://github.com/spectrenoir06/GFX_Root#629a0faf88acb3c39423c74be13f34a760077618
	symlink://../../spectre_protocol
	ESP32Async/ESPAsyncWebServer@3.12.1
	ESP32Async/AsyncTCP@3.5.0


; One firmware for every board: the panel layout (size, chain, wiring, map)
; is a setting chosen from the app (src/Layout.cpp, matrix.layout.set), the
; files go to the SD card when there is one, else to SPIFFS.
[env:matrix]
build_flags =
	${env.build_flags}
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192  ; default 16 KB: RAM is short
	-Wl,--wrap=esp_wifi_init  ; fewer WiFi buffers (Protocol.cpp)
	-D USE_GFX_ROOT
	-D FASTLED_CRGB_SUPPORT=1  ; GFX_Root CRGB drawing (CRGB type: lib/CRGB, not FastLED)
