; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; default_envs = Hat_V1



[env]

platform = platformio/espressif32 @ 7.1.3  ; Arduino core 2.0.17 (ESP-IDF 4.4), pinned
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; board_build.partitions = noota_3g.csv
board_build.partitions = partition_table/Banane.csv
board_build.f_cpu = 240000000L
monitor_filters = esp32_exception_decoder

build_flags = 
	!echo '-D BUILD_GIT_BRANCH=\"'$(git branch --no-color 2> /dev/null | sed -e '/^[^*]/d' -e "s/* \(.*\)/\1/")'\"'
	!echo '-D BUILD_GIT_COMMIT_HASH=\"'$(git log -1 --format=%%h)'\"'
	; -DCORE_DEBUG_LEVEL=5
	; NimBLE host buffers (default 12): 24 = +15-30% BLE upload speed for 3.5 KB RAM
	-D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
lib_deps =  ; exact versions (tested together); HUB75: fork with copyDMABuffer() for GIFs
	git+https://github.com/acondolu/ESP32-HUB75-MatrixPanel-DMA#466454339b1e9d678b187dc3900a620407177328
	h2zero/NimBLE-Arduino@1.4.2
	bitbank2/AnimatedGIF@1.4.7
	https://github.com/spectrenoir06/GFX_Root#629a0faf88acb3c39423c74be13f34a760077618
	symlink://../../spectre_protocol
	ESP32Async/ESPAsyncWebServer@3.12.1
	ESP32Async/AsyncTCP@3.5.0



[env:Banane_V1]
board_build.partitions = partition_table/Banane_wifi.csv  ; WiFi needs > 1 MB of app

build_flags =
	${env.build_flags}
	-D HOSTNAME=\"Banana\ \"

	-D USE_SD
	-D USE_WIFI
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192  ; default 16 KB: RAM is short
	-Wl,--wrap=esp_wifi_init  ; fewer WiFi buffers (Protocol.cpp)

	-D USE_GFX_ROOT
	-D FASTLED_CRGB_SUPPORT=1  ; GFX_Root CRGB drawing (CRGB type: lib/CRGB, not FastLED)

	-D PIXEL_COLOR_DEPTH_BITS=5  ; 6 bits: 8 KB more DMA buffers, too tight next to WiFi
	-D DMA_DOUBLE_BUFF=1

	-D R1_PIN=33
	-D G1_PIN=25
	-D B1_PIN=32
	-D R2_PIN=27
	-D G2_PIN=23
	-D B2_PIN=26
	-D A_PIN=22
	-D B_PIN=21
	-D C_PIN=19
	-D D_PIN=18
	-D E_PIN=-1
	-D CLK_PIN=5
	-D LAT_PIN=17
	-D OE_PIN=16

	-D SD_CS_PIN=2
	-D SD_SCK_PIN=15
	-D SD_MOSI_PIN=14
	-D SD_MISO_PIN=13
	
	-D BRIGHTNESS=50

	-D MATRIX_CHAIN=1
	-D MATRIX_LATCH_BLANK=1
	
	-D BRIGHTNESS=50

	-D MATRIX_WIDTH=64
	-D MATRIX_HEIGHT=32

	-D V_MATRIX_WIDTH=64
	-D V_MATRIX_HEIGHT=32


