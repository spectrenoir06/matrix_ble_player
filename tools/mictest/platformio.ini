; Microphone test firmware: reads the INMP441 and prints what it hears on the
; serial port, nothing else (no panel, SD card or Bluetooth needed).
;
;   pio run -t upload -t monitor        (from this folder)
[env:mictest]
platform = platformio/espressif32 @ 7.1.3
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = ../../partition_table/matrix_4mb.csv  ; the firmware's: back to it without a full reflash
